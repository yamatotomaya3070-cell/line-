<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOODBASE 進捗管理</title>
<style>
/* ==========================================================================
   WOODBASE 進捗管理アプリ — デザインシステム
   木・建築・安心感。アイボリー/ベージュ基調＋ダークブラウンの木目サイドバー。
   ========================================================================== */
:root{
  /* --- 面・地色（アイボリー / ベージュ） --- */
  --bg:        #F4EFE6;
  --bg-soft:   #FBF8F1;
  --panel:     #FFFFFF;
  --panel-2:   #FBF9F4;

  /* --- 木目サイドバー（ダークブラウン） --- */
  --wood-1:    #3B2C20;
  --wood-2:    #4A3627;
  --wood-3:    #2F231A;
  --wood-sel:  #5C4633;   /* 選択中メニュー：少し明るいブラウン */
  --wood-hover:#4F3B2B;
  --wood-ink:  #F1E7DA;
  --wood-mut:  #B6A18C;

  /* --- 文字 --- */
  --ink:       #2B2620;
  --ink-2:     #4A4238;
  --muted:     #857C6E;
  --faint:     #A79E90;

  /* --- 罫線・影 --- */
  --line:      #E8E1D3;
  --line-2:    #EFEADF;
  --shadow-sm: 0 1px 2px rgba(59,44,32,.05);
  --shadow:    0 1px 2px rgba(59,44,32,.05), 0 6px 18px rgba(59,44,32,.06);
  --shadow-lg: 0 12px 40px rgba(59,44,32,.14);

  /* --- 補助色（くすんだ緑 / 薄いオレンジ / グレー） --- */
  --brown:     #B5713C;   /* 現在フェーズ・強調 */
  --brown-d:   #9C5E2E;
  --brown-soft:#F3E4D2;
  --olive:     #7E8B4F;   /* 完了フェーズ */
  --olive-soft:#E8ECD9;
  --sky:       #5E7C8B;
  --sky-soft:  #E1EAEE;
  --amber:     #C99A3D;
  --amber-soft:#F6ECD3;
  --danger:    #BF6B4E;   /* 遅延（原色の赤は使わない） */
  --danger-soft:#F5E1D8;
  --gray-soft: #ECE8DF;
  --gray-mid:  #D9D3C6;

  --radius:    14px;
  --radius-sm: 10px;
  --sidebar-w: 244px;
  --header-h:  70px;
  --ease:      cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",-apple-system,BlinkMacSystemFont,"Segoe UI",Meiryo,sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d8cfbe;border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#c7bca6;background-clip:content-box}

/* ============================ レイアウト ============================ */
.app{display:flex;min-height:100vh}

/* ---------------- サイドバー（木目） ---------------- */
.sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w); position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; color:var(--wood-ink);
  background:
    /* 木目：控えめな縦の板目を重ねる（文字視認性優先で低コントラスト） */
    repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 1px, transparent 1px 46px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 2px, transparent 2px 92px),
    linear-gradient(180deg, var(--wood-2), var(--wood-1) 55%, var(--wood-3));
  box-shadow:2px 0 18px rgba(47,35,26,.22); z-index:30;
}
.brand{padding:22px 20px 16px;display:flex;align-items:center;gap:11px}
.brand .logo{width:34px;height:34px;flex:0 0 34px}
.brand .logo svg{width:100%;height:100%;display:block}
.brand .name{font-size:19px;font-weight:800;letter-spacing:.02em;line-height:1.1}
.brand .name b{font-weight:800}
.brand .tag{font-size:10.5px;color:var(--wood-mut);letter-spacing:.06em;margin-top:2px;font-style:italic}
.nav{flex:1;overflow-y:auto;padding:8px 12px}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);background-clip:content-box}
.nav-sec{font-size:10px;letter-spacing:.14em;color:var(--wood-mut);margin:16px 10px 6px;font-weight:700}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--wood-ink);
  padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;
  margin-bottom:2px;transition:background .16s var(--ease),transform .16s var(--ease);
}
.nav-item .ic{width:18px;height:18px;flex:0 0 18px;opacity:.9}
.nav-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .adm{font-size:9px;font-weight:700;color:#e9c9a3;background:rgba(181,113,60,.28);
  padding:2px 6px;border-radius:20px;letter-spacing:.03em;white-space:nowrap}
.nav-item:hover{background:var(--wood-hover)}
.nav-item.active{background:var(--wood-sel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.nav-item.active .ic{opacity:1;color:#f0d9bf}
.sb-foot{border-top:1px solid rgba(255,255,255,.08);padding:12px}
.userbox{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer;transition:background .16s}
.userbox:hover{background:var(--wood-hover)}
.avatar{width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:linear-gradient(135deg,#8a6a4c,#5c4331);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:#f3e7d8;font-size:14px;
  box-shadow:0 0 0 2px rgba(255,255,255,.10)}
.userbox .u-name{font-size:13px;font-weight:700;line-height:1.2}
.userbox .u-role{font-size:11px;color:var(--wood-mut)}
.sb-links{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.sb-links button{display:flex;align-items:center;gap:9px;background:transparent;border:0;color:var(--wood-mut);
  font-size:12px;padding:7px 10px;border-radius:8px;cursor:pointer;text-align:left;transition:.16s}
.sb-links button:hover{background:var(--wood-hover);color:var(--wood-ink)}

/* ---------------- メインエリア ---------------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:var(--header-h);flex:0 0 var(--header-h);display:flex;align-items:center;gap:16px;
  padding:0 28px;background:rgba(251,248,241,.82);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
}
.topbar .hamb{display:none;background:transparent;border:0;cursor:pointer;color:var(--ink);padding:6px}
.page-title{font-size:20px;font-weight:800;letter-spacing:.01em;margin:0}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.topbar .sp{flex:1}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.16s;color:var(--ink-2)}
.iconbtn:hover{background:var(--panel-2);border-color:var(--gray-mid)}
.iconbtn .badge{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;
  min-width:18px;height:18px;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:0 4px;
  border:2px solid var(--bg-soft)}
.u-chip{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:12px;cursor:pointer;transition:.16s}
.u-chip:hover{background:var(--panel-2)}
.u-chip .avatar{width:34px;height:34px;flex:0 0 34px;font-size:13px}
.u-chip .u-name{font-size:13px;font-weight:700;line-height:1.15;color:var(--ink)}
.u-chip .u-role{font-size:11px;color:var(--muted)}

/* ボタン */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:11px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;transition:.16s var(--ease);white-space:nowrap}
.btn:hover{background:var(--panel-2);border-color:var(--gray-mid);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--brown),var(--brown-d));color:#fff;border-color:transparent;
  box-shadow:0 4px 14px rgba(156,94,46,.28)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}

.content{padding:24px 28px 48px;max-width:1500px;width:100%}

/* ============================ 汎用UI ============================ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card.pad{padding:18px 20px}
.grid{display:grid;gap:16px}
.section-head{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.section-head h2{font-size:15.5px;font-weight:800;margin:0;letter-spacing:.01em}
.section-head .link{margin-left:auto;font-size:12px;color:var(--brown);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:3px}
.section-head .link:hover{text-decoration:underline}

/* サマリーカード */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.sum-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;
  box-shadow:var(--shadow-sm);transition:.18s var(--ease);position:relative;overflow:hidden}
.sum-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.sum-card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sum-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.sum-ic svg{width:22px;height:22px}
.sum-card .delta{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.delta.up{color:#5c7a3a;background:var(--olive-soft)}
.delta.down{color:#a85a3c;background:var(--danger-soft)}
.delta.flat{color:var(--muted);background:var(--gray-soft)}
.sum-card .num{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.01em}
.sum-card .num small{font-size:14px;font-weight:700;color:var(--muted);margin-left:3px}
.sum-card .cap{font-size:12px;color:var(--muted);margin-top:5px}
.ic-green{background:var(--olive-soft);color:#67743f}
.ic-brown{background:var(--brown-soft);color:var(--brown-d)}
.ic-amber{background:var(--amber-soft);color:#a9822f}
.ic-red{background:var(--danger-soft);color:#a85a3c}
.ic-sky{background:var(--sky-soft);color:#4d697a}

/* ホーム2カラム */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
/* グリッド子のmin-width:autoによるはみ出し（テーブルがタイムラインに重なる不具合）を防ぐ */
.home-grid>*{min-width:0}
.home-grid .card{overflow:hidden}
.home-grid .grid{min-width:0}

/* 進捗テーブル */
.ptable{width:100%;border-collapse:separate;border-spacing:0}
.ptable th{font-size:11px;color:var(--faint);font-weight:700;text-align:left;padding:0 12px 10px;letter-spacing:.03em;white-space:nowrap}
.ptable td{padding:12px;border-top:1px solid var(--line-2);vertical-align:middle}
.ptable tbody tr:first-child td{border-top:0}
.prow{cursor:pointer;transition:background .14s}
.prow:hover{background:var(--panel-2)}
.pj-cell{display:flex;align-items:center;gap:12px;min-width:190px}
.thumb{width:46px;height:46px;flex:0 0 46px;border-radius:11px;object-fit:cover;display:flex;align-items:center;
  justify-content:center;font-size:20px;color:#fff;box-shadow:var(--shadow-sm)}
.pj-name{font-size:13.5px;font-weight:700;line-height:1.25}
.pj-meta{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.badge-type{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--gray-soft);color:var(--ink-2);white-space:nowrap}

/* フェーズ・ステッパー（横並び矢羽根） */
.stepper{display:flex;align-items:center;gap:4px;flex-wrap:nowrap}
.step{position:relative;font-size:11px;font-weight:700;padding:5px 12px 5px 15px;white-space:nowrap;color:#fff;
  clip-path:polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%, 9px 50%);}
.step:first-child{clip-path:polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%);padding-left:12px}
.step.done{background:var(--olive)}
.step.current{background:linear-gradient(135deg,var(--brown),var(--brown-d));box-shadow:0 2px 8px rgba(156,94,46,.35)}
.step.todo{background:var(--gray-mid);color:#8b8271}
.step .cnum{opacity:.7;margin-right:3px}

/* 進捗バー */
.prog{display:flex;align-items:center;gap:9px;min-width:120px}
.prog .bar{flex:1;height:8px;border-radius:20px;background:var(--gray-soft);overflow:hidden}
.prog .fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--olive),#9aa860)}
.prog .pct{font-size:12.5px;font-weight:800;min-width:36px;text-align:right}
.updated{font-size:12px;color:var(--muted);white-space:nowrap}

/* タイムライン */
.timeline{position:relative;padding-left:6px}
.tl-item{display:flex;gap:12px;padding:11px 0;position:relative}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:17px;top:38px;bottom:-11px;width:2px;background:var(--line-2)}
.tl-ic{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:flex;align-items:center;justify-content:center;z-index:1}
.tl-ic svg{width:18px;height:18px}
.tl-body .tl-pj{font-size:12.5px;font-weight:700;line-height:1.3}
.tl-body .tl-txt{font-size:12px;color:var(--ink-2);margin-top:1px}
.tl-body .tl-date{font-size:11px;color:var(--faint);margin-top:3px}

/* 管理者メニューカード */
.adm-menu{display:flex;flex-direction:column;gap:10px}
.adm-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);cursor:pointer;transition:.16s var(--ease)}
.adm-item:hover{border-color:var(--brown);background:var(--brown-soft);transform:translateX(2px)}
.adm-item .a-ic{width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:var(--gray-soft);
  display:flex;align-items:center;justify-content:center;color:var(--brown-d)}
.adm-item .a-ic svg{width:19px;height:19px}
.adm-item .a-t{font-size:13px;font-weight:700}
.adm-item .a-d{font-size:11px;color:var(--muted);margin-top:1px}
.adm-item .a-arrow{margin-left:auto;color:var(--faint)}

/* フィルタバー */
.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:8px 12px;min-width:230px;flex:0 0 auto}
.search input{border:0;outline:0;background:transparent;font-size:13px;flex:1;min-width:0;color:var(--ink)}
.search svg{width:16px;height:16px;color:var(--faint)}
select.f{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 12px;font-size:13px;
  color:var(--ink-2);cursor:pointer;font-weight:600}
.toggle-chip{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);
  border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:8px 12px;cursor:pointer}
.toggle-chip input{accent-color:var(--brown)}
.viewtoggle{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}
.viewtoggle button{border:0;background:transparent;padding:8px 11px;cursor:pointer;color:var(--muted);display:flex;align-items:center}
.viewtoggle button.on{background:var(--brown-soft);color:var(--brown-d)}

/* 案件カードグリッド */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:16px}
.pj-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:.18s var(--ease);display:flex;flex-direction:column}
.pj-card:hover{box-shadow:var(--shadow);transform:translateY(-3px)}
.pj-card .cover{height:118px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;position:relative}
.pj-card .cover .delay-tag{position:absolute;top:10px;right:10px;background:var(--danger);color:#fff;font-size:10.5px;
  font-weight:700;padding:3px 9px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pj-card .body{padding:14px 15px 15px;display:flex;flex-direction:column;gap:9px;flex:1}
.pj-card .body .n{font-size:14.5px;font-weight:800;line-height:1.3}
.pj-card .kv{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pj-card .kv b{color:var(--ink-2);font-weight:700}
.pj-card .phase-now{font-size:11.5px;font-weight:700;color:var(--brown-d);background:var(--brown-soft);
  align-self:flex-start;padding:3px 10px;border-radius:8px}

/* ステータス・バッジ */
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:8px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.todo{color:#8b8271;background:var(--gray-soft)}
.st.doing{color:var(--brown-d);background:var(--brown-soft)}
.st.wait{color:#a9822f;background:var(--amber-soft)}
.st.done{color:#67743f;background:var(--olive-soft)}
.st.hold{color:#4d697a;background:var(--sky-soft)}
.st.delay{color:#a85a3c;background:var(--danger-soft)}

/* 案件詳細 */
.detail-head{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;
  box-shadow:var(--shadow-sm);margin-bottom:16px}
.dh-top{display:flex;align-items:flex-start;gap:16px}
.dh-top .thumb{width:64px;height:64px;flex:0 0 64px;font-size:26px;border-radius:14px}
.dh-title{font-size:20px;font-weight:800;letter-spacing:.01em}
.dh-facts{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:8px}
.fact{font-size:12px;color:var(--muted)}
.fact b{color:var(--ink-2);font-weight:700;margin-left:5px}
.dh-right{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.big-prog{display:flex;align-items:center;gap:10px}
.big-prog .ring{position:relative;width:52px;height:52px}
.big-prog .ring svg{transform:rotate(-90deg)}
.big-prog .ring .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{border:0;background:transparent;padding:11px 16px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;
  border-bottom:2.5px solid transparent;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--brown-d);border-bottom-color:var(--brown)}

/* 詳細フェーズカード（縦） */
.phase-list{display:flex;flex-direction:column;gap:10px}
.phase-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);transition:.16s}
.phase-row.cur{border-color:var(--brown);background:var(--brown-soft);box-shadow:0 3px 12px rgba(156,94,46,.12)}
.phase-num{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;background:var(--gray-soft);color:var(--muted)}
.phase-row.done .phase-num{background:var(--olive);color:#fff}
.phase-row.cur .phase-num{background:var(--brown);color:#fff}
.phase-info{flex:1;min-width:0}
.phase-info .pn{font-size:14px;font-weight:800}
.phase-info .pm{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:14px;flex-wrap:wrap}

/* フェーズ設定（管理者） */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.plist{display:flex;flex-direction:column;gap:8px}
.plist .pitem{display:flex;align-items:center;gap:11px;padding:12px 13px;border:1px solid var(--line);border-radius:11px;
  background:var(--panel);cursor:grab;transition:.15s}
.plist .pitem:hover{border-color:var(--gray-mid);box-shadow:var(--shadow-sm)}
.plist .pitem.sel{border-color:var(--brown);background:var(--brown-soft)}
.plist .drag{color:var(--faint);cursor:grab}
.plist .swatch{width:14px;height:14px;border-radius:5px;flex:0 0 14px}
.plist .pt{font-size:13px;font-weight:700;flex:1}
.plist .pd{font-size:11px;color:var(--muted)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:13.5px;font-family:inherit;background:var(--panel-2);color:var(--ink);transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--brown);background:#fff;
  box-shadow:0 0 0 3px rgba(181,113,60,.12)}
.field .hint{font-size:11px;color:var(--faint);margin-top:4px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.swatches{display:flex;gap:8px}
.swatches .sw{width:30px;height:30px;border-radius:9px;cursor:pointer;border:2px solid transparent;transition:.15s}
.swatches .sw.on{border-color:var(--ink);transform:scale(1.08)}

/* テンプレート管理 */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tpl-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);
  transition:.18s var(--ease)}
.tpl-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.tpl-card .th{display:flex;align-items:flex-start;gap:10px}
.tpl-card .tt{font-size:15px;font-weight:800}
.tpl-card .flow{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0}
.flow-chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--gray-soft);color:var(--ink-2)}
.flow-arrow{color:var(--faint);align-self:center;font-size:10px}
.tpl-stat{display:flex;gap:18px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line-2);padding-top:12px;margin-top:4px}
.tpl-stat b{display:block;font-size:15px;color:var(--ink);font-weight:800}
.tpl-actions{display:flex;gap:8px;margin-top:14px}

/* お知らせ/レポート等プレースホルダ */
.empty-state{text-align:center;padding:70px 24px;color:var(--muted)}
.empty-state .es-ic{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;background:var(--gray-soft);
  display:flex;align-items:center;justify-content:center;color:var(--faint)}
.empty-state h3{font-size:16px;color:var(--ink);margin:0 0 6px}
.notice{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:12px}
.notice .n-ic{width:40px;height:40px;flex:0 0 40px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.notice .n-t{font-size:13.5px;font-weight:700}
.notice .n-b{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.notice .n-d{font-size:11px;color:var(--faint);margin-top:5px}

.admin-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--brown-d);
  background:var(--brown-soft);padding:4px 11px;border-radius:20px}
.foldlink{color:var(--brown-d);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.foldlink:hover{text-decoration:underline}
a.flow-chip.foldlink{color:var(--brown-d);background:var(--brown-soft)}
a.flow-chip.foldlink:hover{filter:brightness(.97);text-decoration:none}
.flow-chip.addstore{border:1px dashed var(--gray-mid);background:transparent;color:var(--muted);cursor:pointer;font-weight:700}
.flow-chip.addstore:hover{border-color:var(--brown);color:var(--brown-d);background:var(--brown-soft)}

/* 実データバナー */
.databanner{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);
  padding:8px 14px;background:var(--panel-2);border:1px dashed var(--line);border-radius:11px;margin-bottom:16px}
.databanner .dot{width:8px;height:8px;border-radius:50%;background:var(--olive)}
.databanner.demo .dot{background:var(--amber)}

/* モーダル */
.mask{position:fixed;inset:0;background:rgba(43,38,32,.42);backdrop-filter:blur(2px);display:none;
  align-items:center;justify-content:center;z-index:60;padding:18px}
.mask.on{display:flex}
.modal{background:var(--panel);border-radius:18px;width:100%;max-width:460px;padding:24px;box-shadow:var(--shadow-lg);
  animation:pop .2s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .msub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

/* トースト */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--wood-1);color:#fff;
  padding:11px 20px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s var(--ease);
  z-index:80;box-shadow:var(--shadow-lg)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 権限切替バナー（デモ用） */
.rolebar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
  border-radius:11px;padding:4px;margin-top:10px}
.rolebar button{flex:1;border:0;background:transparent;color:var(--wood-mut);font-size:11.5px;font-weight:700;
  padding:7px 4px;border-radius:8px;cursor:pointer;transition:.15s}
.rolebar button.on{background:var(--brown);color:#fff}

/* オーバーレイ（モバイルサイドバー） */
.scrim{display:none;position:fixed;inset:0;background:rgba(43,38,32,.4);z-index:29}
.scrim.on{display:block}

}

}

/* ==========================================================================
   ユーティリティ
   ========================================================================== */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function isAdmin(){return STATE.role==='admin';}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2000);}
function initials(n){n=String(n||'').trim();return n?n.charAt(0):'?';}
function projById(id){for(var i=0;i<PROJECTS.length;i++)if(PROJECTS[i].id===id)return PROJECTS[i];return null;}
function phaseCount(){return PHASES.length;}
function statusClass(k){return {todo:'todo',doing:'doing',wait:'wait',done:'done',hold:'hold',delay:'delay'}[k]||'doing';}
function progColor(p){return p>=100?'var(--olive)':p>=60?'#9aa860':p>=30?'var(--amber)':'var(--brown)';}
/* 案件名→案件フォルダ、店舗チップ→店舗フォルダ（appGetDataのURLを使用） */
function nameWithFolder(p){
  return p.driveUrl
    ? '<a href="'+esc(p.driveUrl)+'" target="_blank" rel="noopener" class="foldlink" title="案件フォルダを開く">'+esc(p.name)+' '+icon('folder',12)+'</a>'
    : esc(p.name);
}
function storeChips(p,opts){
  opts=opts||{};
  var chips=(p.stores||[]).map(function(s){
    var u=s.storeFolderUrl||s.dataFolderUrl;   // 店舗フォルダ（ひな型一式）を開く
    return u?'<a class="flow-chip foldlink" href="'+esc(u)+'" target="_blank" rel="noopener" title="店舗フォルダ（ひな型）を開く">🏪 '+esc(s.name)+'</a>'
            :'<span class="flow-chip">🏪 '+esc(s.name)+'</span>';
  }).join(' ');
  var addBtn=opts.add?'<button class="flow-chip addstore" data-addstore="'+esc(p.id)+'" title="この案件に店舗を追加">＋店舗</button>':'';
  if(!chips&&!addBtn)return'';
  return '<div class="rowchips" style="margin-top:5px">'+chips+(chips&&addBtn?' ':'')+addBtn+'</div>';}

/* ==========================================================================
   レンダリング：ナビ／ヘッダー／ユーザー

function renderChrome(){
  // ナビ
  var emp='', adm='';

    var html='<button class="nav-item'+(STATE.view===n.id?' active':'')+'" data-nav="'+n.id+'">'
      +'<span class="ic">'+icon(n.icon,18)+'</span><span class="lbl">'+esc(n.label)+'</span>'
      +(n.admin?'<span class="adm">管理者専用</span>':'')+'</button>';
    if(n.admin) adm+=html; else emp+=html;
  });
  var nav='<div class="nav-sec">メニュー</div>'+emp;
  if(isAdmin() && adm) nav+='<div class="nav-sec">管理者メニュー</div>'+adm;
  document.getElementById('nav').innerHTML=nav;

/* ==========================================================================
   ルーター

function go(view, opts){
  opts=opts||{};
  if(view==='detail'&&opts.id){STATE.projectId=opts.id;STATE.detailTab='overview';STATE.selectedPhase=(projById(opts.id)||{}).phaseIdx||0;}
  STATE.view=view;
  setHeader(view==='detail'?'detail':view);
  renderChrome();
  var el=document.getElementById('view');el.scrollTop=0;window.scrollTo(0,0);
  ({home:renderHome,projects:renderProjects,detail:renderDetail,timeline:renderTimeline,
    phases:renderPhases,templates:renderTemplates,reports:renderReports,notices:renderNotices,
    members:renderMembers,settings:renderSettings}[view]||renderHome)(el);
  closeSidebar();
}

/* ==========================================================================
   ステッパー / 進捗
   ========================================================================== */
function stepper(curIdx){
  var h='<div class="stepper">';
  PHASES.forEach(function(p,i){
    var cls=i<curIdx?'done':(i===curIdx?'current':'todo');
    h+='<span class="step '+cls+'">'+esc(p)+'</span>';
  });
  return h+'</div>';
}
function progressBar(p){
  return '<div class="prog"><div class="bar"><div class="fill" style="width:'+p+'%;background:linear-gradient(90deg,'+progColor(p)+',#b5713c00)"></div></div>'
    +'<span class="pct">'+p+'%</span></div>';
}
function ring(p){
  var r=22,c=2*Math.PI*r,off=c*(1-p/100);
  return '<div class="ring"><svg width="52" height="52"><circle cx="26" cy="26" r="'+r+'" stroke="var(--gray-soft)" stroke-width="6" fill="none"/>'
    +'<circle cx="26" cy="26" r="'+r+'" stroke="'+progColor(p)+'" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/></svg>'
    +'<div class="lbl">'+p+'%</div></div>';
}

    +'<div class="kv">'+icon('user',14)+'<b>'+esc(p.assignee||'未設定')+'</b></div>'
    +'<span class="phase-now">'+esc(PHASES[p.phaseIdx])+'：'+esc(p.statusLabel)+'</span>'
    +progressBar(p.progress)
    +storeChips(p,{add:true})
    +'<div class="kv" style="margin-top:auto;padding-top:4px">'+icon('clock',14)+'最終更新 '+esc(p.updated)+'</div>'
    +'</div></div>';
}
function filteredProjects(){
  var f=STATE.filter;
  return PROJECTS.filter(function(p){
    if(f.q && (p.name+' '+p.loc+' '+p.client).toLowerCase().indexOf(f.q.toLowerCase())<0) return false;
    if(f.status==='active' && p.progress>=100) return false;
    if(f.status==='done' && p.progress<100) return false;
    if(f.status==='delay' && !p.delayed) return false;
    if(f.assignee!=='all' && p.assignee!==f.assignee) return false;
    if(f.type!=='all' && p.type!==f.type) return false;
    if(f.delayOnly && !p.delayed) return false;
    return true;
  });
}
function uniq(a){var s={},o=[];a.forEach(function(x){if(x&&!s[x]){s[x]=1;o.push(x);}});return o;}

  var bars=PHASES.map(function(p,i){

      +'<div style="width:100%;max-width:64px;height:'+h+'px;background:linear-gradient(180deg,'+col+','+col+'cc);border-radius:8px 8px 4px 4px"></div>'
      +'<div style="font-size:11px;color:var(--muted);text-align:center">'+esc(p)+'</div></div>';
  }).join('');

function setPhase(idx){
  var p=projById(STATE.projectId);if(!p)return;
  p.phaseIdx=idx;p.statusLabel=(STATUS_MASTER[PHASES[idx]]||['進行中'])[0]||'進行中';p.statusKind='doing';
  p.progress=Math.round(idx/(PHASES.length-1)*100);
  if(STATE.dataSource==='live'){
    google.script.run.withSuccessHandler(function(r){toast(r&&r.ok?'フェーズを更新しました':'更新失敗'); loadAux();})
      .withFailureHandler(function(){toast('更新失敗');}).appSetPhase(p.id,PHASES[idx],USER.name);
  }else{ toast('フェーズを「'+PHASES[idx]+'」に更新しました（デモ）'); }
  renderDetail(document.getElementById('view'));
}
function stKindOf(s){s=s||'';if(/失注|保留/.test(s))return'hold';if(/完了|承認|受注|済|引き渡し/.test(s))return'done';if(/待ち|検査/.test(s))return'wait';return'doing';}
function setStatus(id,val){
  var p=projById(id);if(!p)return;
  if(val){p.statusLabel=val;p.statusKind=stKindOf(val);}
  if(STATE.dataSource==='live'){
    google.script.run.withSuccessHandler(function(r){toast(r&&r.ok?'状況を更新しました':((r&&r.msg)||'更新失敗')); loadAux();})
      .withFailureHandler(function(){toast('更新失敗');}).appSetStatus(id,val,USER.name);
  }else toast('状況を「'+(val||'—')+'」に更新（デモ）');
  renderDetail(document.getElementById('view'));
}
function setProgress(id,val){
  var p=projById(id);if(!p)return;p.progress=Number(val);
  if(STATE.dataSource==='live'){
    google.script.run.withSuccessHandler(function(r){toast(r&&r.ok?'進捗を更新しました':((r&&r.msg)||'更新失敗')); loadAux();})
      .withFailureHandler(function(){toast('更新失敗');}).appSetProgress(id,val,USER.name);
  }else toast('進捗を'+val+'%に更新（デモ）');
  renderDetail(document.getElementById('view'));
}
/* 店舗ごとの進捗更新（店舗タブ） */
function storeById(key){
  for(var i=0;i<PROJECTS.length;i++){var ss=PROJECTS[i].stores||[];
    for(var j=0;j<ss.length;j++){ if((ss[j].storeId&&ss[j].storeId===key)||ss[j].name===key) return {store:ss[j],project:PROJECTS[i]}; }}
  return null;
}
function recomputeRollup(p){
  if(!p.stores||!p.stores.length)return;
  p.progress=Math.round(p.stores.reduce(function(a,s){return a+(s.progress||0);},0)/p.stores.length);
  p.phaseIdx=Math.min.apply(null,p.stores.map(function(s){return s.phaseIdx;}));
  p.storeRollup=true;
}
function setStoreField(key,kind,val){
  var f=storeById(key);if(!f)return;var s=f.store,p=f.project;
  if(kind==='phase'){ s.phase=val;s.phaseIdx=Math.max(0,PHASES.indexOf(val));
    s.statusLabel=(STATUS_MASTER[val]||['未着手'])[0]||'未着手';s.statusKind='doing';
    s.progress=Math.round(s.phaseIdx/(PHASES.length-1)*100); }
  else if(kind==='status'){ if(val){s.statusLabel=val;s.statusKind=stKindOf(val);} }
  else if(kind==='progress'){ s.progress=Number(val); }
  recomputeRollup(p);
  if(STATE.dataSource==='live'&&typeof google!=='undefined'&&google.script&&s.storeId){
    var run=google.script.run.withSuccessHandler(function(r){toast(r&&r.ok?'店舗の進捗を更新しました':((r&&r.msg)||'更新失敗'));loadAux();})
      .withFailureHandler(function(){toast('更新失敗');});
    if(kind==='phase')run.appSetStorePhase(s.storeId,val,USER.name);
    else if(kind==='status')run.appSetStoreStatus(s.storeId,val,USER.name);
    else run.appSetStoreProgress(s.storeId,val,USER.name);
  }else{ toast('店舗「'+s.name+'」の進捗を更新（デモ）'); }
  renderDetail(document.getElementById('view'));
}
function addStore(id,btn){
  var p=projById(id);if(!p)return;
  var sn=(typeof prompt==='function'?(prompt('「'+p.name+'」に追加する店舗名（例：藤沢店）')||''):'').trim();
  if(!sn)return;
  if(btn){btn.disabled=true;btn.textContent='＋作成中…';}
  var reset=function(){if(btn){btn.disabled=false;btn.textContent='＋店舗';}};
  if(STATE.dataSource==='live'&&typeof google!=='undefined'&&google.script){
    google.script.run.withSuccessHandler(function(r){
      if(r&&r.ok){toast('店舗「'+sn+'」を追加・フォルダ作成しました');loadLive(true);}
      else{toast((r&&r.msg)||'店舗追加エラー');reset();}
    }).withFailureHandler(function(e){toast('店舗追加エラー：'+(e&&e.message||e));reset();}).appAddStore(id,sn,USER.name);
  }else{
    p.stores=(p.stores||[]).concat([{name:sn,storeFolderUrl:'',dataFolderUrl:''}]);
    toast('店舗「'+sn+'」を追加しました（デモ）');reset();go(STATE.view);
  }
}
function archiveProject(id){
  var p=projById(id);if(!p)return;
  if(typeof confirm==='function' && !confirm('「'+p.name+'」をボードから取り消します（アーカイブ）。よろしいですか？'))return;
  var after=function(){PROJECTS=PROJECTS.filter(function(x){return x.id!==id;});go('projects');};
  if(STATE.dataSource==='live'){
    google.script.run.withSuccessHandler(function(r){ if(r&&r.ok){toast('アーカイブしました');after();}else toast((r&&r.msg)||'失敗'); })
      .withFailureHandler(function(){toast('失敗');}).appArchiveProject(id,USER.name);
  }else{ toast('アーカイブしました（デモ）'); after(); }
}

  }

function closeLineModal(){document.getElementById('lineMask').classList.remove('on');}
function renderLineModal(r){
  var body=document.getElementById('lineBody');
  if(!r||!r.ok){body.innerHTML='<div class="tl-txt" style="color:var(--danger)">'+esc((r&&r.msg)||'取得失敗')+'</div>';return;}
  var admin=isAdmin(),linked=(r.linked||[]);
  var linkedHtml=linked.length?linked.map(function(g){
    return '<div class="notice" style="margin:0 0 8px;align-items:center"><div class="n-ic ic-green">'+icon('users',18)+'</div>'
      +'<div style="flex:1;min-width:0"><div class="n-t">'+esc(g.label||gidShort(g.groupId))+(g.kind?' <span class="st todo" style="font-weight:600">'+esc(g.kind)+'</span>':'')+'</div>'
      +'<div class="n-d" style="font-family:monospace;word-break:break-all">'+esc(g.groupId)+'</div></div>'
      +(admin?'<button class="btn sm ghost" style="color:var(--danger)" data-lineunlink="'+esc(g.groupId)+'">解除</button>':'')+'</div>';
  }).join(''):'<div class="tl-txt" style="color:var(--faint);padding:4px 2px 10px">まだLINEグループは紐付いていません</div>';
  var cands=(r.candidates||[]);
  var candHtml=cands.length?cands.map(function(c){
    var mine=linked.some(function(x){return x.groupId===c.groupId;});
    var tag=mine?'<span class="st done">この案件</span>':(c.linkedTo?'<span class="st wait">'+esc(c.linkedTo)+'</span>':'<span class="st todo">未紐付け</span>');
    return '<div class="notice" style="margin:0 0 8px;align-items:center"><div class="n-ic ic-sky">'+icon('users',18)+'</div>'
      +'<div style="flex:1;min-width:0"><div class="n-t">'+tag+'</div>'
      +'<div class="n-d" style="font-family:monospace">'+esc(gidShort(c.groupId))+' ・ '+esc(c.last||'')+' ・ '+c.count+'件</div>'
      +(c.sample?'<div class="n-d">「'+esc(c.sample)+'」</div>':'')+'</div>'
      +(admin&&!mine?'<button class="btn sm" data-linelink="'+esc(c.groupId)+'">この案件に紐付け</button>':'')+'</div>';
  }).join(''):'<div class="tl-txt" style="color:var(--faint);padding:4px 2px">候補グループがありません（メッセージログが空、またはBotが未参加）</div>';
  body.innerHTML='<div style="font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 8px">紐付け済みグループ</div>'+linkedHtml
    +'<div style="font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 8px">候補（最近のLINEグループ）</div>'+candHtml;
}
document.getElementById('lineClose').addEventListener('click',closeLineModal);
document.getElementById('lineMask').addEventListener('click',function(e){if(e.target.id==='lineMask')closeLineModal();});
document.getElementById('lineBody').addEventListener('click',function(e){
  var lk=e.target.closest('[data-linelink]'),un=e.target.closest('[data-lineunlink]');
  if(!lk&&!un)return;
  var pid=LINE_CTX.pid,btn=lk||un,gid=btn.getAttribute(lk?'data-linelink':'data-lineunlink');
  if(typeof google==='undefined'||!google.script){toast('デモではこの操作はできません');return;}
  btn.disabled=true;
  var fn=lk?'appLinkLineGroup':'appUnlinkLineGroup';
  google.script.run.withSuccessHandler(function(res){
    if(res&&res.ok){toast(lk?'紐付けました':'解除しました');openLineModal(pid);}
    else{toast((res&&res.msg)||'失敗');btn.disabled=false;}
  }).withFailureHandler(function(){toast('失敗');btn.disabled=false;})[fn](pid,gid);
});

function ymd(v){ // 日付文字列/Date → yyyy-MM-dd（比較用）。不能なら''
  if(!v)return'';var d=new Date(String(v).replace(/[./]/g,'-').replace(/-/g,'/'));return isNaN(d.getTime())?'':
    d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function todayYmd(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function mapLive(d){
  PHASES=(d.phases&&d.phases.length)?d.phases:PHASES;
  STATUS_MASTER=d.statusMaster||{};
  var TYPES=['注文住宅','リフォーム','店舗工事','オフィス','公共施設'];
  var stKind=function(s){s=s||'';if(/失注|保留/.test(s))return'hold';if(/完了|承認|受注|済|引き渡し/.test(s))return'done';
    if(/待ち|検査/.test(s))return'wait';return'doing';};
  var TD=todayYmd();
  var mapStore=function(s){
    var sIdx=s.phase?Math.max(0,PHASES.indexOf(s.phase)):0;
    var sp=(s.progress!==''&&s.progress!=null&&!isNaN(Number(s.progress)))?Number(s.progress):Math.round(sIdx/(PHASES.length-1)*100);
    return {storeId:s.storeId,name:s.name,storeFolderUrl:s.storeFolderUrl||'',dataFolderUrl:s.dataFolderUrl||'',
      phase:s.phase||PHASES[0],phaseIdx:sIdx,progress:isNaN(sp)?0:sp,
      statusLabel:s.status||'未着手',statusKind:s.status?stKind(s.status):'todo',updated:s.updated||''};
  };
  PROJECTS=(d.projects||[]).map(function(r,i){
    var idx=Math.max(0,PHASES.indexOf(r.phase));
    var prog=r.phase==='施工'&&r.progress!==''?Number(r.progress):Math.round(idx/(PHASES.length-1)*100);
    var nextDue=ymd(r.nextDue), deliv=ymd(r.deliveryDue), start=ymd(r.startDue);
    var delayed=(nextDue && nextDue<TD && prog<100);
    var stores=(r.stores||[]).map(mapStore);
    var storeRollup=false;
    if(stores.length){ // 店舗ごと進捗 → 案件はロールアップ表示（進捗=平均・フェーズ=最も遅い店舗）
      prog=Math.round(stores.reduce(function(a,s){return a+s.progress;},0)/stores.length);
      idx=Math.min.apply(null,stores.map(function(s){return s.phaseIdx;}));
      storeRollup=true;
    }
    return {id:r.id,name:r.name||'(無名)',type:r.type||TYPES[i%TYPES.length],loc:r.loc||(r.client||'—'),
      client:r.client||'',assignee:r.assignee||'',phaseIdx:idx,progress:isNaN(prog)?0:prog,
      updated:r.updated||nextDue||'—',statusKind:delayed?'delay':stKind(r.status),statusLabel:r.status||PHASES[idx],
      delayed:delayed,cover:COVERS[idx%COVERS.length],
      driveUrl:r.caseFolderUrl||r.driveUrl||'',driveStatus:r.driveStatus||'',stores:stores,storeRollup:storeRollup,
      nextAction:r.nextAction||'',nextDue:nextDue,startDue:start,deliveryDue:deliv,note:r.note||''};
  });
}
function loadLive(silent){
  if(typeof google==='undefined'||!google.script||!google.script.run){return;}
  google.script.run.withSuccessHandler(function(d){
    try{
      if(d&&d.projects&&d.projects.length){ mapLive(d);STATE.dataSource='live';
        if(!silent)toast('実データを読み込みました（'+PROJECTS.length+'件）');
        go(STATE.view); loadAux();
      }
    }catch(err){/* デモのまま */}
  }).withFailureHandler(function(){/* デモのまま */}).appGetData();
}
/* タイムライン(project_logs)・お知らせ(project_alerts)を実データで取得しキャッシュ */
var LIVE_TL=null, LIVE_NOTICES=null;
function loadAux(){
  if(typeof google==='undefined'||!google.script||!google.script.run)return;
  google.script.run.withSuccessHandler(function(t){ if(t&&t.length){LIVE_TL=t; if(STATE.view==='home'||STATE.view==='timeline'||STATE.view==='detail')go(STATE.view);} })
    .withFailureHandler(function(){}).appGetTimeline(60);
  google.script.run.withSuccessHandler(function(n){ LIVE_NOTICES=n||[]; if(STATE.view==='notices')go('notices'); })
    .withFailureHandler(function(){}).appGetNotices(30);
}
/* 実ログ→タイムライン表示用に整形（アイコン付き） */
function tlIconFor(intent){return {phase_update:'build',status_update:'play',assignee_update:'user',
  progress_update:'build',archive:'trash',billing_update:'yen',payment_update:'money'}[intent]||'task';}
function liveTimeline(pid){
  if(!LIVE_TL)return null;
  var rows=pid?LIVE_TL.filter(function(e){return e.projectId===pid;}):LIVE_TL;
  return rows.map(function(e){return {icon:tlIconFor(e.intent),pj:e.name,
    txt:e.label+(e.detail?'（'+e.detail+'）':'')+(e.who?' ・ '+e.who:''),date:e.date};});
}

/* ==========================================================================
   起動
   ========================================================================== */
renderChrome();
go('home');
loadLive(true);   // 実データがあれば静かに上書き
</script>
